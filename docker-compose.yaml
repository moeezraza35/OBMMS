services:
  frontend-builder:
    build:
      context: ./frontend
      target: artifacts
    image: obmms-frontend:latest
    env_file:
      - ./frontend/.env

  backend:
    build:
      context: ./backend
      additional_contexts:
        frontend: "service:frontend-builder"
    container_name: obmms_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python main.py runserver